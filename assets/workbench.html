<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAYFRAME · 框架剪辑</title>
<style>
:root{font-family:"Microsoft YaHei UI",system-ui,sans-serif;color:#20333b;background:#f7f9fa;font-size:14px;--teal:#09817f;--line:#e3e9ec}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{border:1px solid var(--line);background:white;border-radius:6px;padding:9px 13px;color:inherit;cursor:pointer}button:hover{background:#eaf5f2}button:disabled{opacity:.45;cursor:default}.primary{background:var(--teal);color:white;border-color:var(--teal)}header{height:65px;display:flex;align-items:center;padding:0 23px;gap:14px;background:white;border-bottom:1px solid var(--line)}header img{width:33px}header strong{font-size:20px}header small{color:#76858c}header .actions{margin-left:auto;display:flex;gap:8px}.grid{height:calc(100vh - 65px);display:grid;grid-template-columns:340px minmax(360px,1fr) 290px}.manuscript,.inspector{background:white;overflow:auto;padding:20px;border-right:1px solid var(--line)}.inspector{border-right:0;border-left:1px solid var(--line)}h2{font-size:16px;margin:0 0 17px}.help{font-size:12px;color:#72818a;line-height:1.65}.row{border-bottom:1px solid var(--line);padding:17px 0;display:flex;gap:9px;line-height:1.75;cursor:grab}.row:active{cursor:grabbing}.row .number{font-size:11px;color:#8c9ba1;padding-top:3px}.row p{margin:3px 0;font-size:14px}.row time{font-size:11px;color:#819199}.row button{padding:2px 5px;border:0;color:var(--teal);font-size:12px}.row.over{border-top:3px solid var(--teal)}.row.removed{opacity:.65}.stage{padding:24px;display:flex;flex-direction:column;min-width:0;overflow:auto}.stage video{max-width:100%;max-height:calc(100vh - 300px);width:100%;background:#101a1f;min-height:200px}.video-holder{flex:1;display:flex;align-items:center;justify-content:center}.status{background:#e9f4f0;color:#346b61;padding:12px 15px;margin-bottom:15px;line-height:1.6;border-radius:6px}.status.warn{background:#fff4df;color:#8a6231}.caption{display:flex;gap:9px;align-items:center;margin-top:15px;color:#63757e;font-size:12px}.caption strong{color:var(--teal)}.inspector label{display:block;margin:19px 0 7px;color:#58707b;font-size:12px}.inspector input:not([type=range]),.inspector select{width:100%;padding:9px;border:1px solid var(--line);border-radius:5px;background:white}input[type=range]{width:100%;accent-color:var(--teal)}.instruction{background:#eff5f6;padding:13px;line-height:1.8;margin-top:22px}.error{color:#a14931;white-space:pre-wrap}.timeline{margin-top:18px;display:flex;min-height:35px;gap:2px;overflow:hidden}.timeline span{height:26px;background:#d5e9e3;border-radius:3px;min-width:3px;flex:1}.muted{color:#72838c}details{margin-top:20px}summary{cursor:pointer;padding:10px 0}#loading{padding:60px;text-align:center}a{color:var(--teal)}@media(max-width:1050px){.grid{grid-template-columns:300px 1fr}.inspector{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.grid{height:auto}.manuscript,.stage{max-height:80vh}.instruction{margin:0}header small{display:none}}@media(max-width:700px){header{padding:12px;height:auto;flex-wrap:wrap}.grid{display:flex;flex-direction:column}.stage{order:-1}.manuscript{max-height:none}.inspector{display:block}.video-holder video{max-height:50vh}}
</style>
<style>.cover-panel{border-top:1px solid var(--line);margin-top:24px;padding-top:22px;grid-column:1/-1}.cover-panel h2{margin-bottom:9px}.cover-panel .reference{width:100%;max-height:150px;object-fit:contain;background:#f5f2eb;border-radius:6px}.cover-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:16px}.cover-option img{width:100%;aspect-ratio:9/16;object-fit:contain;background:#e9eded;border-radius:4px}.cover-option button{width:100%;padding:7px 1px;font-size:11px}.cover-option.selected img{outline:3px solid var(--teal)}.cover-panel #make-covers{width:100%;margin-top:14px}.cover-panel #cover-note{font-size:12px;line-height:1.6;color:#58707b}</style>
<style>.plan-panel{grid-column:1/-1;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}.plan-option{border:1px solid var(--line);border-radius:8px;padding:13px;margin:12px 0}.plan-option .plan-brief{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.plan-option h3{font-size:15px;margin:0 0 7px}.plan-option p{font-size:12px;line-height:1.65;margin:8px 0}.plan-option button{width:100%;margin-top:10px}.plan-option details{margin:5px 0}.plan-option .gap{color:#936a27}</style><header><img src="mark.svg" alt="SAYFRAME"><strong>SAYFRAME</strong><small>WorkBuddy · 本机工作台</small><div class="actions"><button id="undo">撤销</button><button id="redo">重做</button><button id="export" class="primary">导出视频</button></div></header>
<div id="loading">正在读取工程…</div><main class="grid" hidden>
<section class="manuscript"><h2>剪辑文稿 <small id="count" class="muted"></small></h2><div class="help">拖动文稿可调整顺序。删去的内容可在下方恢复。</div><div id="rows"></div><details><summary>未选用的原话 <span id="removedCount"></span></summary><div id="removed"></div></details></section>
<section class="stage"><div id="status" class="status"></div><div class="video-holder"><video controls preload="metadata" id="player"></video></div><div class="caption"><strong id="mode"></strong><span id="duration"></span><button id="switch">查看原片</button></div><div id="timeline" class="timeline"></div><p id="error" class="error"></p></section>
<aside class="inspector"><h2>标题与声音</h2><div><label for="captionsEnabled">自动字幕</label><select id="captionsEnabled"><option value="">确认方向后选择</option><option value="on">添加</option><option value="off">不添加</option></select><label for="titleEnabled">画面标题</label><select id="titleEnabled"><option value="">确认方向后选择</option><option value="on">添加</option><option value="off">不添加</option></select><label for="title">标题文字（开启时显示）</label><input id="title" maxlength="60"><label for="name">姓名</label><input id="name" maxlength="30"><label for="intro">介绍</label><input id="intro" maxlength="80"><p class="help">介绍显示时段由WorkBuddy按内容设置，最多三次。</p></div><div><label for="voice">人声音量 <b id="voiceValue"></b></label><input id="voice" type="range" min="0" max="4" step=".05"><label for="musicVolume">音乐音量 <b id="musicVolumeValue"></b></label><input id="musicVolume" type="range" min="0" max="1" step=".01"><label for="speed">视频速度</label><select id="speed"><option value=".75">0.75×</option><option value="1">1× 原速</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><p id="music" class="help"></p></div><div class="instruction">继续在WorkBuddy里说：<br>“换个剪辑方向”<br>“把案例放到观点后面”<br>“配上这首音乐”<br><small class="muted">同一个工程，内容修改后重新生成查看成片。</small></div></aside></main>
<script>
const coverPanel=document.createElement('section');coverPanel.className='cover-panel';coverPanel.innerHTML='<h2>封面</h2><details><summary>内置风格参考</summary><img class="reference" src="cover/reference" alt="匿名风格示意：青绿笔触、浅底大字、黑金重点"></details><label for="cover-title">封面主标题</label><input id="cover-title" maxlength="24"><label for="cover-subtitle">封面副标题</label><input id="cover-subtitle" maxlength="28"><button id="make-covers">确认文字，生成三版排版</button><p id="cover-note">先确定文字，再出三个版本。AI装饰可在WorkBuddy里生成，不需要另填密钥。</p><div id="cover-options" class="cover-options"></div>';document.querySelector('.inspector').append(coverPanel);
const planPanel=document.createElement('section');planPanel.className='plan-panel';planPanel.innerHTML='<h2>剪辑方案</h2><p id="plan-help" class="help">先在WorkBuddy里说“分析完整视频，给我几个剪辑方向”。确认方向与字幕、标题选项后再成片，还能继续用自然语言修改。</p><section id="direction-confirmation" hidden style="background:#edf7f3;padding:14px;border-radius:8px"><h3 id="chosen-direction"></h3><p class="help">确认这条方向，再选择画面里要加什么。两项都可以不加。</p><label for="captions-choice">自动字幕</label><select id="captions-choice"><option value="">请选择</option><option value="on">添加字幕</option><option value="off">不加字幕</option></select><label for="title-choice">画面标题</label><select id="title-choice"><option value="">请选择</option><option value="on">添加标题</option><option value="off">不加标题</option></select><button id="confirm-direction" class="primary" disabled>确认方向并开始剪辑</button></section><div id="plan-options"></div>';document.querySelector('.inspector').prepend(planPanel);
const $=s=>document.querySelector(s),root=location.pathname,token=root.split('/')[1];let state,dragId,pendingDirection=null,raw=false,pendingDownload=false,busy=false,lastVideo='';
async function api(name,body){const r=await fetch(root+'api/'+name,body?{method:'POST',headers:{'Content-Type':'application/json','X-Sayframe-Token':token,'X-Sayframe-Version':'0.4.0'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}
function clock(n){return Math.floor(n/60).toString().padStart(2,'0')+':'+Math.floor(n%60).toString().padStart(2,'0')}
async function modify(changes){try{await api('apply',{revision:state.revision,changes});raw=false;await refresh(true)}catch(e){$('#error').textContent=e.message}}
function row(r,removed=false){let d=document.createElement('div');d.className='row'+(removed?' removed':'');d.draggable=!removed;let a=document.createElement('span');a.className='number';a.textContent=removed?'＋':'⠿';d.append(a);let content=document.createElement('div');let t=document.createElement('time');t.textContent=clock(r.start)+' — '+clock(r.end);let p=document.createElement('p');p.textContent=r.text;let b=document.createElement('button');b.textContent=removed?'恢复整句':'不选用';b.onclick=()=>modify({summary:removed?'恢复完整原话':'移除完整原话',order:removed?[...state.order,r.id]:state.order.filter(x=>x!==r.id)});content.append(t,p,b);d.append(content);d.ondragstart=()=>dragId=r.id;d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');d.ondrop=e=>{e.preventDefault();if(dragId===r.id)return;let order=state.order.filter(x=>x!==dragId);order.splice(order.indexOf(r.id),0,dragId);modify({summary:'通过工作台拖动调整完整原句顺序',order})};return d}
async function refresh(force=false){try{let next=await api('state');if(next.engineVersion!=='0.4.0'){throw Error('工作台已升级，请在WorkBuddy里重新打开工程。')}let changed=!state||next.revision!==state.revision||next.planning?.id!==state.planning?.id;state=next;$('#loading').hidden=true;$('main').hidden=false;busy=state.status.status==='running';$('#export').disabled=busy||!state.workflow.directionConfirmed||Boolean(state.cover&&!state.cover.selected);$('#export').textContent=busy?'正在生成…':!state.workflow.directionConfirmed?'先确认剪辑方向':state.cover&&!state.cover.selected?'先选封面':'导出视频';for(const k of ['captionsEnabled','titleEnabled']){$('#'+k).disabled=busy||!state.workflow.directionConfirmed;if(document.activeElement!==$('#'+k))$('#'+k).value=state.settings[k]===null?'':(state.settings[k]??true)?'on':'off';}$('#undo').disabled=!state.canUndo||busy;$('#redo').disabled=!state.canRedo||busy;
if(changed||force){const refs=new Map(state.segments.map(r=>[r.id,r]));$('#rows').replaceChildren(...state.order.map(id=>row(refs.get(id))));let removed=state.segments.filter(r=>!r.kept);$('#removed').replaceChildren(...removed.map(r=>row(r,true)));$('#count').textContent=state.order.length+'段';$('#removedCount').textContent=removed.length+'段';for(const key of ['title','name','intro','voice','musicVolume','speed'])if(document.activeElement!==$('#'+key))$('#'+key).value=state.settings[key];$('#voiceValue').textContent=Math.round(state.settings.voice*100)+'%';$('#musicVolumeValue').textContent=Math.round(state.settings.musicVolume*100)+'%';$('#music').textContent=state.settings.musicFile?'已添加本次配乐':'尚未配乐，可在WorkBuddy中指定音乐文件';$('#timeline').replaceChildren(...state.order.map(()=>document.createElement('span')))}
renderPlanning(changed||force);renderCovers(changed||force);
const final=state.hasCurrentMovie&&!raw,content=state.hasContentPreview&&!final&&!raw;const video=root+(final?'media/final':content?'media/content':'media/source')+((final||content)?'?r='+state.status.seal.revision:'');if(lastVideo!==video){$('#player').src=video;lastVideo=video}$('#mode').textContent=final?'当前成片':content?'剪辑预览 · 封面待合成':'原片预览';$('#switch').textContent=final||content?'查看原片':state.hasCurrentMovie||state.hasContentPreview?'返回成片':'尚未生成当前稿';$('#switch').disabled=!(state.hasCurrentMovie||state.hasContentPreview);$('#duration').textContent=final||content?clock(state.status.seal.duration):clock(state.duration);$('#status').className='status'+(!state.hasCurrentMovie?' warn':'');$('#status').textContent=busy?'正在生成并检查声音，请等结果，不重复点击。':state.status.status==='blocked'?(state.status.notice||'声音切口尚未通过，原稿保留。'):final?'成片已生成 · 预览与下载为同一视频。仍需回听原声口吃与识别分歧。':content?'剪辑内容已生成。封面版本请在右侧选择，选好自动合成。':'当前显示原片，文稿修改尚未生成新成片。';if(pendingDownload&&state.hasCurrentMovie&&!busy){pendingDownload=false;const a=document.createElement('a');a.href=root+'download';a.download='SAYFRAME.mp4';a.click()}
if(state.status.status==='error'){$('#status').textContent=state.status.message||'生成失败，原稿保留。请在WorkBuddy里继续处理。';pendingDownload=false}
if(state.status.status==='blocked')pendingDownload=false;
}catch(e){$('#loading').textContent=e.message;$('#error').textContent=e.message}}
$('#switch').onclick=()=>{raw=!raw;refresh()};$('#undo').onclick=async()=>{try{await api('undo',{});await refresh(true)}catch(e){$('#error').textContent=e.message}};$('#redo').onclick=async()=>{try{await api('redo',{});await refresh(true)}catch(e){$('#error').textContent=e.message}};$('#export').onclick=async()=>{try{pendingDownload=true;await api('export',{});setTimeout(refresh,600)}catch(e){pendingDownload=false;$('#error').textContent=e.message}};
for(const key of ['title','name','intro','voice','musicVolume','speed'])$('#'+key).onchange=e=>modify({summary:'在工作台调整'+key,settings:{[key]:['voice','musicVolume','speed'].includes(key)?Number(e.target.value):e.target.value}});
function renderCovers(changed){
$('#make-covers').disabled=busy||!state.hasContentPreview&&!state.hasCurrentMovie;
$('#cover-note').textContent=state.cover?state.cover.selected?(state.hasCurrentMovie?'已合成：封面写入视频首帧。':'已选择，正在等成片合成。'):'三个版本已生成，选择后自动合成进视频首帧。':'确认文字可生成三版排版；也可在WorkBuddy里使用默认参考图做AI装饰。';
for(const b of $('#cover-options').querySelectorAll('button'))b.disabled=busy;
if(!changed)return;
for(const [id,value] of [['cover-title',state.cover?.title||state.settings.title],['cover-subtitle',state.cover?.subtitle||'']])if(document.activeElement!==$('#'+id))$('#'+id).value=value;
$('#cover-options').replaceChildren(...(state.cover?.candidates||[]).map(item=>{
const d=document.createElement('div');d.className='cover-option'+(state.cover.selected===item.id?' selected':'');
const image=document.createElement('img');image.src=root+'cover/candidate/'+item.id+'?r='+state.revision;image.alt=item.label;
const b=document.createElement('button');b.textContent='选用'+item.label;b.disabled=busy;
b.onclick=async()=>{try{b.disabled=true;await api('cover-select',{candidate:item.id,revision:state.revision});await api('export',{});await refresh(true)}catch(e){$('#error').textContent=e.message;b.disabled=false}};
d.append(image,b);return d}))}
function renderPlanning(changed){
const p=state.planning,m=state.methodology,applicable=p&&(state.revision===p.baseRevision||m?.plan===p.id&&m.status==='applied');
$('#plan-help').textContent=m?.status==='edited-after-plan'?'当前稿已按你的修改调整。要换方向，请在WorkBuddy里重新分析。':p?'先看每条讲什么、为什么这样剪，再确认一个方向与字幕、标题选项。':'在WorkBuddy里说“分析完整视频，给我几个剪辑方向”。确认方向与字幕、标题选项后再成片。';
for(const b of $('#plan-options').querySelectorAll('button'))b.disabled=busy||!applicable;
if(!changed)return;
$('#plan-options').replaceChildren(...(p?.directions||[]).map(d=>{
const card=document.createElement('article');card.className='plan-option';
const h=document.createElement('h3');h.textContent=d.title;
const method=document.createElement('p');method.className='help';method.textContent=d.methodNames.map(n=>n.replace(/^蛋解/,'')).join(' · ');
const who=document.createElement('p');who.className='plan-brief';who.textContent=d.audience+' · '+d.goal;
const why=document.createElement('p');why.className='plan-brief';why.textContent=d.why;
const timing=document.createElement('p');timing.className='help';timing.textContent='预计约'+Math.round(d.estimatedSeconds/state.settings.speed)+'秒（最终以实际成片为准）';
const detail=document.createElement('details');const summary=document.createElement('summary');summary.textContent='查看选句和结构';detail.append(summary);const fullWhy=document.createElement('p');fullWhy.textContent=d.why;detail.append(fullWhy);
const roles={opening:'开场',support:'支撑',ability:'绝活',audience:'人群',ending:'结尾',story:'故事',bridge:'连接'};const quotes=new Map(d.evidence.map(e=>[e.id,e.quote]));
for(const beat of d.beats){const title=document.createElement('strong');title.textContent=roles[beat.role]+'：'+beat.reason;const q=document.createElement('p');q.textContent=beat.ids.map(id=>quotes.get(id)).join(' / ');detail.append(title,q)}
for(const gap of [...d.gaps,...d.warnings]){const note=document.createElement('p');note.className='gap';note.textContent=gap;detail.append(note)}
const b=document.createElement('button');b.className='primary';b.textContent='选择这个方向';b.setAttribute('aria-label','选择这个方向：'+d.title);b.disabled=busy||!applicable;
b.onclick=()=>{pendingDirection={plan:p.id,direction:d.id,revision:state.revision};$('#chosen-direction').textContent=d.title;$('#captions-choice').value='';$('#title-choice').value='';$('#confirm-direction').disabled=true;$('#direction-confirmation').hidden=false;$('#direction-confirmation').scrollIntoView({block:'nearest',behavior:'smooth'})};
card.append(h,method,who,why,timing,detail,b);return card}))}
$('#make-covers').onclick=async()=>{const b=$('#make-covers');b.disabled=true;b.textContent='正在生成三个版本…';try{await api('cover-generate',{title:$('#cover-title').value,subtitle:$('#cover-subtitle').value,confirmed:true});await refresh(true)}catch(e){$('#error').textContent=e.message}finally{b.textContent='确认文字，生成三版排版';b.disabled=false}};
for(const k of ['captionsEnabled','titleEnabled'])$('#'+k).onchange=e=>modify({summary:'调整字幕和标题选择',settings:{[k]:e.target.value==='on'}});
for(const id of ['captions-choice','title-choice'])$('#'+id).onchange=()=>{$('#confirm-direction').disabled=busy||!$('#captions-choice').value||!$('#title-choice').value};
$('#confirm-direction').onclick=async()=>{try{if(!pendingDirection||!$('#captions-choice').value||!$('#title-choice').value)return;$('#confirm-direction').disabled=true;await api('choose-plan',{...pendingDirection,confirmed:true,captionsEnabled:$('#captions-choice').value==='on',titleEnabled:$('#title-choice').value==='on'});pendingDirection=null;$('#direction-confirmation').hidden=true;await api('export',{});raw=false;await refresh(true)}catch(e){$('#error').textContent=e.message;await refresh(true)}};
refresh();setInterval(()=>{if(document.visibilityState==='visible')refresh()},2500);
</script></html>
